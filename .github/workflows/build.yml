name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Verify Remapped Mod Jar
        id: verify_jar
        run: |
          MOD_JAR=$(find build/libs -maxdepth 1 -name "bamboofps-*.jar" ! -name "*-dev.jar" ! -name "*-sources.jar" ! -name "*-dev-shadow.jar" | head -n 1)
          if [ -z "$MOD_JAR" ] || [ ! -f "$MOD_JAR" ]; then
            echo "::error::Remapped mod jar not found in build/libs!"
            ls -la build/libs/
            exit 1
          fi
          echo "Found remapped mod jar: $MOD_JAR"
          echo "Verifying jar contents..."
          unzip -l "$MOD_JAR" | grep "bamboofps.refmap.json" || { echo "::error::bamboofps.refmap.json missing from $MOD_JAR!"; exit 1; }
          unzip -l "$MOD_JAR" | grep "fabric.mod.json" || { echo "::error::fabric.mod.json missing from $MOD_JAR!"; exit 1; }
          unzip -l "$MOD_JAR" | grep "bamboofps.mixins.json" || { echo "::error::bamboofps.mixins.json missing from $MOD_JAR!"; exit 1; }
          echo "Verification passed successfully!"
          echo "jar_path=$MOD_JAR" >> "$GITHUB_OUTPUT"

      - name: Upload Mod Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bamboofps-build
          path: ${{ steps.verify_jar.outputs.jar_path }}
