name: Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read and Bump Version
        id: bump_version
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          CURRENT_VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "Current version: $CURRENT_VERSION"
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
          
          if [[ "$COMMIT_MSG" == *"#major"* ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "$COMMIT_MSG" == *"#minor"* ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          
          sed -i "s/^mod_version=.*/mod_version=${NEW_VERSION}/" gradle.properties
          
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build

      - name: Find Release Jar
        id: find_jar
        run: |
          MOD_JAR=$(find build/libs -maxdepth 1 -name "bamboofps-${{ steps.bump_version.outputs.new_version }}.jar" ! -name "*-sources.jar" | head -n 1)
          if [ -z "$MOD_JAR" ]; then
            MOD_JAR=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-sources.jar" | head -n 1)
          fi
          echo "Mod Jar: $MOD_JAR"
          echo "jar_path=$MOD_JAR" >> "$GITHUB_OUTPUT"
          echo "jar_name=$(basename "$MOD_JAR")" >> "$GITHUB_OUTPUT"

      - name: Commit and Push Version Bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump version to ${{ steps.bump_version.outputs.new_version }} [skip ci]"
          git push origin main

      - name: Create Git Tag and GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump_version.outputs.new_version }}"
          name: "BambooFPS v${{ steps.bump_version.outputs.new_version }} (Minecraft 1.21.11)"
          generate_release_notes: true
          files: ${{ steps.find_jar.outputs.jar_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Discord Webhook with Release Jar
        if: "${{ env.DISCORD_WEBHOOK != '' }}"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          VERSION="${{ steps.bump_version.outputs.new_version }}"
          JAR_PATH="${{ steps.find_jar.outputs.jar_path }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v${VERSION}"
          
          MESSAGE_TEXT="🚀 **BambooFPS v${VERSION}** has been released for Minecraft Java **1.21.11**!
          
          📦 **Download:** Attached jar below or from GitHub Releases:
          🔗 ${RELEASE_URL}
          
          ✨ **Release Summary:**
          • Targets Minecraft Java 1.21.11 (Fabric Loader >= 0.18.2, Fabric API 0.141.3+1.21.11)
          • Fixes client-side FPS lag near massive farms (bamboo, hoppers, crafters, dispensers, pistons)
          • Fully configurable via \`config/bamboofps.json\` and \`/bamboofps\` commands
          • Auto-reloads on disk changes & supports master toggle (Keybind **B**)"
          
          curl -H "Content-Type: multipart/form-data" \
               -F "content=${MESSAGE_TEXT}" \
               -F "file=@${JAR_PATH}" \
               "${DISCORD_WEBHOOK}"
